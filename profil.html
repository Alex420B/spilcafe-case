<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min profil</title>
    <link rel="stylesheet" href="css/profil.css">
</head>
<body>
    <div class="profile-page">
        <!-- Simple image placeholders keep both header icons easy to replace later. -->
        <header class="profile-header">
            <a class="header-icon" href="index.html" aria-label="Tilbage">
                <img src="img/placeholder-back.svg" alt="">
            </a>
            <h1>Min Profil</h1>
            <img class="header-icon settings-icon" src="img/placeholder-settings.svg" alt="Indstillinger">
        </header>

        <main>
            <section class="profile-summary" aria-label="Profil">
                <img class="profile-picture" src="img/placeholder-profile.svg" alt="Profilbillede">
                <h2>Asty</h2>
            </section>

            <!-- The two activity boxes mirror the stacked cards in the reference image. -->
           <section class="activity-cards" aria-label="Spilaktivitet">
                <article class="activity-card">
                    <span class="activity-symbol heart" aria-hidden="true">♥</span>
                    <div>
                        <p class="card-label">Favoritter</p>
                        <p class="card-value">0 spil</p>
                    </div>
                </article>
                <article class="activity-card">
                    <span class="activity-symbol clock" aria-hidden="true">◷</span>
                    <div>
                        <p class="card-label">Senest spillede</p>
                        <p class="card-value">0 spil</p>
                    </div>
                </article>
            </section>

            <!-- basisk side som gerne vil have siden til at "huske" hvilke spil som man kan lide -->
            <section class="liked-games" aria-labelledby="liked-games-title">
                <h2 id="liked-games-title">Spil du kan lide</h2>
                <ul class="games-list">
                    <article class="game-card">
                        <img src="img/Varulv.svg" alt="">
                        <h3>Varulv</h3>
                    </article>
                </ul>
            </section>
        </main>
    </div>
</body>
</html>
